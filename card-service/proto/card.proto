syntax = "proto3";

option go_package = "github.com/yourusername/traefik-grpc-example/card-service/proto";

package modulecard;

service CardService {
  rpc CreateCard (CreateCardRequest) returns (CreateCardResponse) {}
}

message CreateCardRequest {
  string card_number = 1;
  string owner_name = 2;
}

message CreateCardResponse {
  string card_id = 1;
  string message = 2;
}